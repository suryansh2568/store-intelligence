databases:
  # PostgreSQL Database
  - name: store-intelligence-db
    databaseName: store_intelligence
    plan: free
    region: oregon

services:

  # FastAPI Backend
  - type: web
    name: store-intelligence-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: store-intelligence-db
          property: connectionString
      - key: PORT
        value: 8000
    healthCheckPath: /health

  # Streamlit Dashboard
  - type: web
    name: store-intelligence-dashboard
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.dashboard
    dockerContext: .
    envVars:
      - key: API_URL
        value: https://store-intelligence-api.onrender.com
      - key: PORT
        value: 8501
